services:
  stats:
    build: .
    env_file:
      - .env
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${STATS_PORT:-8091}:80"
    volumes:
      - stats-data:/data
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro,rslave
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 64
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

volumes:
  stats-data:
